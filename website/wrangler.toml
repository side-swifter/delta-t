# Cloudflare Worker serving the built site (dist/) as static assets.
# Use this when the Cloudflare build's root directory is "website".
# worker.js redirects http to https and adds security headers.
name = "delta-t-website"
compatibility_date = "2026-01-01"
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
