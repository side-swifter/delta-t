name: Website build

on:
  push:
    paths: ['website/**', 'data/workload_trace_standard.csv', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'data/workload_trace_standard.csv', '.github/workflows/website.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
